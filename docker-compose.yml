services:
  norelational_db:
    build:
      context: ./norelational_db
    image: multiple_llm_norelational_db_image
    container_name: multiple_llm_norelational_db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root  ### no relational_db username
      MONGO_INITDB_ROOT_PASSWORD: root  ### no relational_db password
    ports:
      - "27027:27017"
    volumes:
      - ./volumes/mongo_news_LLM:/data/db
    networks:
      - multiple_llm_network_news

  vector_db:
    build:
      context: ./vector_db
    image: multiple_llm_vector_db_image
    container_name: multiple_llm_vector_db
    ports:
      - "8001:8000"
    volumes:
      - ./volumes/chroma-data:/root/.chromadb
    networks:
      - multiple_llm_network_news

  data_engine:
    build:
      context: ./data_engine
    image: multiple_llm_data_engine_image
    container_name: multiple_llm_data_engine
    volumes:
      - ./volumes/data_engine:/app
    depends_on:
      - norelational_db     
    ports:
      - "5010:5000"
    networks:
      - multiple_llm_network_news

  context_manager:
    build:
      context: ./context_manager
    image: multiple_llm_context_manager_image
    container_name: multiple_llm_context_manager
    depends_on:
      - norelational_db     
    ports:
      - "6002:7000"
    networks:
      - multiple_llm_network_news

  ollama_qwen:
    build:
      context: .              
      dockerfile: ollama_qwen/Dockerfile  # <--- Le decimos dónde está el archivo (necesario para que cargue los modelfiles)
    image: multiple_llm_ollama_qwen_image
    container_name: multiple_llm_ollama_qwen
    volumes:
      - ./volumes/ollama_qwen:/app
      - ./volumes/ollama_qwen_models:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      # Asignamos 4 núcleos exclusivos
      - OLLAMA_NUM_THREADS=4
      #- OLLAMA_NUM_PARALLEL=1
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_FLASH_ATTENTION=0
      - OLLAMA_KV_CACHE_TYPE=f16
    networks:
      - multiple_llm_network_news
    deploy:
      resources:
        reservations:
          devices:
             -  driver: nvidia
                count: 1
                capabilities: [gpu]

  ollama_mistral:
    build:
      context: .              
      dockerfile: ollama_mistral/Dockerfile
    image: multiple_llm_ollama_mistral_image
    container_name: multiple_llm_ollama_mistral
    volumes:
      - ./volumes/ollama_mistral:/app
      - ./volumes/ollama_mistral_models:/root/.ollama
    ports:
      - "11436:11434"
    environment:
      # Asignamos 4 núcleos exclusivos
      - OLLAMA_NUM_THREADS=4
      #- OLLAMA_NUM_PARALLEL=1
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_FLASH_ATTENTION=0
      - OLLAMA_KV_CACHE_TYPE=f16
    networks:
      - multiple_llm_network_news
    deploy:
      resources:
        reservations:
          devices:
             -  driver: nvidia
                count: 1
                capabilities: [gpu]

  
  ollama_llama:
    build:
      context: .              
      dockerfile: ollama_llama/Dockerfile  # <--- Le decimos dónde está el archivo (necesario para que cargue los modelfiles)
    image: multiple_llm_ollama_llama_image
    container_name: multiple_llm_ollama_llama
    volumes:
      - ./volumes/ollama_llama:/app
      - ./volumes/ollama_llama_models:/root/.ollama
    ports:
      - "11436:11434"
    environment:
      # Asignamos 4 núcleos exclusivos
      - OLLAMA_NUM_THREADS=4
      #- OLLAMA_NUM_PARALLEL=1
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_FLASH_ATTENTION=0
      - OLLAMA_KV_CACHE_TYPE=f16
    networks:
      - multiple_llm_network_news
    deploy:
      resources:
        reservations:
          devices:
             -  driver: nvidia
                count: 1
                capabilities: [gpu]

  ollama_gema:
    build:
      context: .              
      dockerfile: ollama_gema/Dockerfile  # <--- Le decimos dónde está el archivo (necesario para que cargue los modelfiles)
    image: multiple_llm_ollama_gema_image
    container_name: multiple_llm_ollama_gema
    volumes:
      - ./volumes/ollama_gema:/app
      - ./volumes/ollama_gema_models:/root/.ollama
    ports:
      - "11435:11434"
    environment:
      # Asignamos 4 núcleos exclusivos
      - OLLAMA_NUM_THREADS=4
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_KEEP_ALIVE=24h
    networks:
      - multiple_llm_network_news

networks:
  multiple_llm_network_news:
    external: true

